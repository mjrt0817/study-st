<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ST A-1 Trainer - Standalone</title>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--text:#142033;--muted:#66758a;--line:#dfe6ef;--p:#1f5fae;--ps:#e8f1fc;--ok:#178a55;--oks:#e8f7ef;--ng:#bf3c3c;--ngs:#fff0f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic",Meiryo,sans-serif}button{font:inherit;cursor:pointer}.wrap{max-width:900px;margin:auto;padding:22px 14px 60px}.hero{background:linear-gradient(135deg,#173e73,#2367b7);color:white;border-radius:22px;padding:25px 28px}.hero h1{margin:4px 0;font-size:32px}.hero p{margin:0;opacity:.9}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{font-size:28px}.panel{margin-top:14px}.panel h2{margin-top:0}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.action{border:1px solid var(--line);border-radius:14px;background:white;padding:16px;text-align:left}.action.primary{background:var(--p);color:white;border-color:var(--p)}.action strong,.action small{display:block}.action small{margin-top:4px;color:var(--muted)}.action.primary small{color:#dceaff}.cats{display:flex;flex-wrap:wrap;gap:7px}.cats button{border:1px solid var(--line);background:#fafcff;border-radius:999px;padding:8px 11px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.link{border:0;background:transparent;color:var(--p);font-weight:700}.progress{height:6px;background:#dfe7f1;border-radius:99px;overflow:hidden;margin-bottom:16px}.progress div{height:100%;background:var(--p)}.question{font-size:24px;line-height:1.6}.badges{display:flex;gap:6px}.badge{background:var(--ps);color:var(--p);font-size:12px;font-weight:700;border-radius:999px;padding:5px 9px}.choices{display:grid;gap:9px}.choice{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:white;border-radius:13px;padding:13px}.choice.sel{border-color:var(--p);background:var(--ps)}.choice.ok{border-color:var(--ok);background:var(--oks)}.choice.ng{border-color:var(--ng);background:var(--ngs)}.key{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef2f7;font-weight:800}.conf{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:15px 0}.conf button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px}.conf button.on{border-color:var(--p);color:var(--p);background:var(--ps);font-weight:700}.primarybtn{width:100%;border:0;background:var(--p);color:white;border-radius:12px;padding:14px;font-weight:800}.primarybtn:disabled{opacity:.45}.ex{margin-top:18px;padding:16px;border-radius:14px;background:#f7f9fc;line-height:1.7}.stats{display:grid;gap:8px}.stat{display:grid;grid-template-columns:160px 1fr 60px;gap:10px;align-items:center}.bar{height:9px;background:#edf1f5;border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--p)}.muted{color:var(--muted)}.notice{background:#fff7dc;border:1px solid #edd895;color:#7a5a0a;border-radius:10px;padding:10px;margin:12px 0}@media(max-width:650px){.cards{grid-template-columns:repeat(3,1fr)}.card{padding:12px}.card strong{font-size:23px}.actions{grid-template-columns:1fr}.question{font-size:20px}.stat{grid-template-columns:120px 1fr 50px}.conf{grid-template-columns:1fr}}
  </style>
</head>
<body><div id="app"></div>
<script>
const Q=[
{id:'q1',c:'基礎理論',s:'論理回路',q:'2入力AND回路で、入力A=1、入力B=0のとき、出力として正しいものはどれか。',o:['0','1','入力Aと同じ','不定'],a:0,e:'AND（論理積）は全ての入力が1のときだけ1を出力します。'},
{id:'q2',c:'基礎理論',s:'数値表現',q:'8ビットの符号なし2進数で表現できる最大の10進数はどれか。',o:['127','128','255','256'],a:2,e:'8ビットでは256通りを表し、0から始まるので最大値は255です。'},
{id:'q3',c:'コンピュータシステム',s:'CPU',q:'CPUのキャッシュメモリの主な目的として最も適切なものはどれか。',o:['主記憶より大容量のデータを保存する','CPUと主記憶の速度差を緩和する','停電時にもデータを保持する','ネットワーク通信を暗号化する'],a:1,e:'高速なキャッシュをCPU近くに置き、主記憶との速度差を緩和します。'},
{id:'q4',c:'システム構成',s:'可用性',q:'MTBFが900時間、MTTRが100時間のシステムの稼働率として最も近いものはどれか。',o:['0.10','0.50','0.90','0.99'],a:2,e:'稼働率=900/(900+100)=0.90です。'},
{id:'q5',c:'データベース',s:'正規化',q:'関係データベースの正規化を行う主な目的はどれか。',o:['検索結果を必ず暗号化する','データの重複や更新時の不整合を減らす','表の行数を必ず半分にする','主キーを不要にする'],a:1,e:'正規化はデータ重複を抑え、更新異常を防ぎやすくします。'},
{id:'q6',c:'ネットワーク',s:'TCP/IP',q:'TCPの特徴として最も適切なものはどれか。',o:['到達保証を行わない','順序制御や再送制御で信頼性を確保する','IPアドレスをMACアドレスへ変換する','ドメイン名をIPアドレスへ変換する'],a:1,e:'TCPは確認応答、順序制御、再送制御などを行います。'},
{id:'q7',c:'セキュリティ',s:'暗号',q:'送信者の秘密鍵で電子署名を作成した場合、検証に用いる鍵はどれか。',o:['送信者の公開鍵','送信者の秘密鍵','受信者の公開鍵','受信者の秘密鍵'],a:0,e:'署名は送信者の秘密鍵で作成し、送信者の公開鍵で検証します。'},
{id:'q8',c:'法務',s:'個人情報保護',q:'個人情報の取扱いに関する説明として適切なものはどれか。',o:['取得後は目的を問わず自由に利用できる','利用目的をできる限り特定し、その範囲を意識して取り扱う','氏名がなければ常に個人情報ではない','漏えい対策は不要である'],a:1,e:'利用目的の特定や目的に沿った適切な取扱い、安全管理が重要です。'},
{id:'q9',c:'法務',s:'著作権',q:'著作権に関する説明として最も適切なものはどれか。',o:['プログラムは著作物になり得ない','著作権は登録しないと発生しない','プログラムも著作物として保護対象になり得る','購入したソフトは自由に複製配布できる'],a:2,e:'プログラムも著作物として保護対象になり得ます。'},
{id:'q10',c:'経営戦略',s:'SWOT',q:'SWOT分析において、自社の内部環境に属する要素の組合せはどれか。',o:['強みと弱み','機会と脅威','強みと機会','弱みと脅威'],a:0,e:'強み・弱みが内部環境、機会・脅威が外部環境です。'}
];
let A=JSON.parse(localStorage.getItem('st-demo-a')||'[]'),state='home',quiz=[],idx=0,sel=null,conf='unsure',done=false,session=[];
const app=document.getElementById('app');
const acc=list=>list.length?Math.round(list.filter(x=>x.ok).length/list.length*100):null;
const cats=[...new Set(Q.map(x=>x.c))];
function start(kind,cat){let p=[...Q];if(kind==='wrong'){const ids=new Set(A.filter(x=>!x.ok).map(x=>x.id));p=p.filter(x=>ids.has(x.id))}if(kind==='cat')p=p.filter(x=>x.c===cat);if(kind==='weak'){const m={};A.forEach(x=>(m[x.c]??=[]).push(x));const weak=new Set(Object.keys(m).filter(k=>(acc(m[k])??100)<65));const ids=new Set(A.filter(x=>!x.ok||x.conf==='unknown').map(x=>x.id));const w=p.filter(x=>weak.has(x.c)||ids.has(x.id));if(w.length)p=w}if(!p.length)return alert('対象問題がまだありません');p.sort(()=>Math.random()-.5);quiz=p.slice(0,kind==='mock'?Math.min(30,p.length):Math.min(10,p.length));idx=0;sel=null;done=false;session=[];state='quiz';render()}
function answer(){if(sel===null)return;const q=quiz[idx],ok=sel===q.a;A.push({id:q.id,c:q.c,ok,conf,t:Date.now()});localStorage.setItem('st-demo-a',JSON.stringify(A));session.push(ok);done=true;render()}
function next(){if(idx+1>=quiz.length){state='result'}else{idx++;sel=null;conf='unsure';done=false}render()}
function home(){state='home';render()}
function render(){if(state==='quiz')return renderQuiz();if(state==='result')return renderResult();if(state==='stats')return renderStats();renderHome()}
function renderHome(){const total=acc(A),unknown=A.filter(x=>x.conf==='unknown').length;app.innerHTML=`<main class="wrap"><section class="hero"><div class="muted" style="color:#d9e8f8;font-size:12px;font-weight:700">ITストラテジスト 2026</div><h1>科目A-1 トレーナー</h1><p>解く → 弱点を見つける → 弱点だけ反復する。</p></section><section class="cards"><div class="card"><span>累計回答</span><strong>${A.length}</strong></div><div class="card"><span>正答率</span><strong>${total??'—'}${total===null?'':'%'}</strong></div><div class="card"><span>知らなかった</span><strong>${unknown}</strong></div></section><section class="panel"><h2>今日の学習</h2><div class="actions"><button class="action primary" onclick="start('random')"><strong>▶ ランダム10問</strong><small>まず現在地を確認</small></button><button class="action" onclick="start('mock')"><strong>30 A-1模擬</strong><small>収録数の範囲で出題</small></button><button class="action" onclick="start('weak')"><strong>↻ 苦手を優先</strong><small>誤答・低正答率・知らなかった</small></button><button class="action" onclick="start('wrong')"><strong>× 誤答だけ</strong><small>間違えた問題を再確認</small></button></div></section><section class="panel"><div class="top"><h2>分野別に解く</h2><button class="link" onclick="state='stats';render()">成績を見る</button></div><div class="cats">${cats.map(c=>`<button onclick="start('cat','${c}')">${c}</button>`).join('')}</div></section><section class="panel"><p class="muted">この単体版はUI確認用のオリジナル10問です。Next.js版には20問、JSON追加、ブックマーク等を収録しています。</p></section></main>`}
function renderQuiz(){const q=quiz[idx];app.innerHTML=`<main class="wrap"><div class="top"><button class="link" onclick="home()">← 終了</button><strong>${idx+1} / ${quiz.length}</strong></div><div class="progress"><div style="width:${(idx+1)/quiz.length*100}%"></div></div><section class="panel"><div class="badges"><span class="badge">${q.c}</span><span class="badge">${q.s}</span></div><h1 class="question">${q.q}</h1><div class="choices">${q.o.map((o,i)=>`<button class="choice ${sel===i?'sel':''} ${done&&i===q.a?'ok':''} ${done&&sel===i&&i!==q.a?'ng':''}" ${done?'disabled':''} onclick="sel=${i};render()"><span class="key">${['ア','イ','ウ','エ'][i]}</span><span>${o}</span></button>`).join('')}</div>${!done?`<div class="conf"><button class="${conf==='confident'?'on':''}" onclick="conf='confident';render()">自信あり</button><button class="${conf==='unsure'?'on':''}" onclick="conf='unsure';render()">迷った</button><button class="${conf==='unknown'?'on':''}" onclick="conf='unknown';render()">知らなかった</button></div><button class="primarybtn" ${sel===null?'disabled':''} onclick="answer()">回答する</button>`:`<div class="ex"><strong style="color:${sel===q.a?'var(--ok)':'var(--ng)'}">${sel===q.a?'○ 正解':'× 不正解'}</strong><p>${q.e}</p><small class="muted">出典：オリジナル問題（A-1出題範囲準拠）</small><button class="primarybtn" style="margin-top:12px" onclick="next()">${idx+1===quiz.length?'結果を見る':'次の問題'}</button></div>`}</section></main>`}
function renderResult(){const rate=Math.round(session.filter(Boolean).length/session.length*100);app.innerHTML=`<main class="wrap"><section class="panel" style="text-align:center;margin-top:40px"><h1 style="font-size:46px;color:var(--p);margin-bottom:0">${rate}%</h1><p>${session.filter(Boolean).length}/${session.length} 正解</p><h2>${rate>=75?'良いペースです':rate>=60?'合格圏を狙えます':'弱点が見えてきました'}</h2><button class="primarybtn" onclick="start('wrong')">誤答を復習</button><button class="link" style="margin-top:14px" onclick="home()">ホームへ戻る</button></section></main>`}
function renderStats(){app.innerHTML=`<main class="wrap"><div class="top"><button class="link" onclick="home()">← 戻る</button><h2>分野別成績</h2><span></span></div><section class="panel stats">${cats.map(c=>{const l=A.filter(x=>x.c===c),r=acc(l);return`<div class="stat"><strong>${c}<small class="muted" style="display:block">${l.length}回答</small></strong><div class="bar"><div style="width:${r??0}%"></div></div><strong>${r===null?'—':r+'%'}</strong></div>`}).join('')}</section></main>`}
render();
</script></body></html>
